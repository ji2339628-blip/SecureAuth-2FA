
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #10172a, #243b65);
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 410px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            color: #172554;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }

        .message {
            margin-top: 15px;
            color: #d12b2b;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <p>Verify your account using one of your last 3 passwords.</p>

    <form action="/reset-password" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Your username"
            required
        >

        <input
            type="password"
            name="old_password"
            placeholder="Previous password"
            required
        >

        <input
            type="password"
            name="new_password"
            placeholder="New password (minimum 8 characters)"
            minlength="8"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">Change Password</button>

    </form>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <a href="/">Back to Login</a>

</div>

</body>
</html>
